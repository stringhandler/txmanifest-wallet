[package]
name = "tx-manifest-lib"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Declarative transaction-manifest engine and SimplicityHL covenant runtime for Liquid/Elements and Bitcoin."
repository = "https://github.com/stringhandler/txmanifest-wallet"
keywords = ["liquid", "elements", "simplicity", "covenant", "bitcoin"]

[dependencies]
# The manifest model, validation, programs and covenants. Re-exported from this crate's
# root, so `tx_manifest_lib::manifest` and the rest read as they always have.
txmanifest-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dialoguer = "0.11"
console = "0.15"
lwk_wollet = "0.9"
lwk_signer = "0.9"
bip39 = "2"
elements-miniscript = "0.4"
lwk_common = "0.9"
dirs-next = "2.0.0"
rand = "0.8"
ureq = "2"
url = "2"
base64 = "0.22"

[features]
default = []
# Forwards to txmanifest-core/simplicity_eval: the code paths that rely on SimplicityHL
# additions not in upstream master.
simplicity_eval = ["txmanifest-core/simplicity_eval"]
